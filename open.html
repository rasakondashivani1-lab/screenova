<!DOCTYPE html>
<html>
<head>
    <title>Start Watching</title>

    <style>
        body {
            background-color: black;
            color: white;
            font-family: Arial;
            margin: 0;
        }

        h1 {
            text-align: center;
            color: red;
            padding: 20px;
        }

        .movies {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            padding: 20px;
        }

        .movie-card {
            background: #111;
            padding: 10px;
            border-radius: 10px;
            transition: 0.3s;
        }

        .movie-card:hover {
            transform: scale(1.05);
        }

        video {
            width: 100%;
            border-radius: 10px;
        }

        .btn {
            background: red;
            padding: 10px;
            text-align: center;
            display: block;
            margin: 10px auto;
            width: 200px;
            border-radius: 5px;
            cursor: pointer;
        }

        .btn:hover {
            background: darkred;
        }
    </style>
</head>

<body>

<h1>🔥 Now Streaming Horror</h1>

<div class="movies">

    <div class="movie-card">
        <video controls>
            <source src="C:\mnsy\raju-gari-gadhi- horror.mp4" type="video/mp4">
        </video>
        <p>Raju gari gadhi</p>
    </div>

    <div class="movie-card">
        <video controls>
            <source src="horror-aakasha-ganga.mp4" type="video/mp4">
        </video>
        <p>Aakasha Ganga</p>
    </div>

    <div class="movie-card">
        <video controls>
            <source src="kanchana3.mp4" type="video/mp4">
        </video>
        <p>Kanchana 3</p>
    </div>

    <div class="movie-card">
        <video controls>
            <source src="paapa-telugu-horror.mp4" type="video/mp4">
        </video>
        <p>Paapa</p>
    </div>

</div>

<!-- UNIQUE FEATURE -->
<div class="btn" onclick="fearMode()">😈 Fear Mode</div>

<audio id="sound" src="scary.mp3"></audio>

<img id="ghost" src="ghost.png" 
style="display:none; position:fixed; width:100%; height:100%; top:0; left:0; z-index:999;">

<script>
function fearMode() {

    // flicker effect
    setInterval(() => {
        document.body.style.background =
        document.body.style.background === "black" ? "#111" : "black";
    }, 200);

    // random jump scare
    setTimeout(() => {
        document.getElementById("ghost").style.display = "block";
        document.getElementById("sound").play();
    }, Math.random() * 8000 + 4000);
}
</script>

</body>
</html>
